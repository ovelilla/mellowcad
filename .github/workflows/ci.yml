name: CI

# The pre-commit hook's checks, again after a push. Free on a public repo's
# standard runners; kept lean all the same: one job, a timeout, a newer push
# cancels an older run, and a change to prose only runs nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", ".claude/**", ".changeset/**"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", ".claude/**", ".changeset/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Packages
        run: |
          for package in cad packages/*; do
            npm run build -w "$package"
            npm run check -w "$package"
          done

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Docs
        run: npm run docs:check

      # Coverage thresholds live in vitest.config.ts and fail the run on their
      # own, so a drop in coverage is a build failure rather than a report.
      - name: Test
        run: npm run test:coverage
