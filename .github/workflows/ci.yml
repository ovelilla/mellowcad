name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine package
        run: npm run build -w cad && npm run check -w cad

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Coverage thresholds live in vitest.config.ts and fail the run on their
      # own, so a drop in coverage is a build failure rather than a report.
      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
