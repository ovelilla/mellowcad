name: Release

# Run by hand from the Actions tab, never on a push: it publishes every
# package whose version npm does not have yet (`changeset publish`), through
# npm's trusted publishing, so with provenance and no token. The first
# version of a package is published from the owner's machine: npm only
# trusts a workflow for a package that already exists.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the version tags
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # WHY: changeset publish tags each version with `git tag -m`, an
      # annotated tag, which needs an identity; without one it fails in
      # silence and no tag is pushed (0.1.1's run).
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Each package's prepublishOnly runs its check:hosts first.
      - run: npx changeset publish

      - run: git push origin --follow-tags
